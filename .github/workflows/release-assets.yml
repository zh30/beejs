name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    name: Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create release archive
        env:
          VERSION: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          cp "target/${TARGET}/release/bee" release/
          tar -czf "bee-${VERSION}-${TARGET}.tar.gz" -C release bee

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: bee-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
          draft: false
          prerelease: false
