name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-assets:
    name: Build Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create release archive
        env:
          VERSION: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          cp "target/${TARGET}/release/bee" release/
          tar -czf "bee-${VERSION}-${TARGET}.tar.gz" -C release bee

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-${{ matrix.target }}
          path: bee-${{ inputs.tag }}-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish Release and Notes
    runs-on: ubuntu-latest
    needs: build-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Generate formal release notes and checksums
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${{ inputs.tag }}" \
            --release-dir release \
            --output RELEASE_NOTES.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release/**/bee-*.tar.gz
            release/checksums.txt
          draft: false
          prerelease: false
